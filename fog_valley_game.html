<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌫️ 안개 계곡 탈출 — 경사하강법 게임</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    margin: 0; color: #1f2937; background: #0f172a;
    word-break: keep-all;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1;
    background: url('fog_mountain.jpg') center/cover no-repeat;
    opacity: 0.25; filter: blur(2px);
  }
  header { text-align: center; color: #fff; padding: 26px 16px 6px; }
  header h1 { margin: 0 0 8px; font-size: 26px; }
  header p { margin: 0; font-size: 14px; color: #cbd5e1; }
  main { max-width: 980px; margin: 0 auto; padding: 12px 16px 40px; }
  .card {
    background: rgba(255,255,255,.96); border-radius: 16px;
    padding: 16px; margin-top: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.25);
  }
  #game { width: 100%; height: auto; display: block; border-radius: 12px; background: #0b1220; }
  .levels { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .lv-btn {
    border: 2px solid #e5e7eb; background: #fff; border-radius: 10px;
    padding: 8px 14px; font-size: 14px; font-weight: 700; cursor: pointer; color: #374151;
  }
  .lv-btn.active { border-color: #1a73e8; background: #eff6ff; color: #1a73e8; }
  .lv-desc { font-size: 13px; color: #6b7280; margin: -4px 0 12px; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn {
    border: none; border-radius: 10px; padding: 12px 18px;
    font-size: 15px; font-weight: 800; cursor: pointer;
  }
  .btn-step { background: #1a73e8; color: #fff; }
  .btn-auto { background: #10b981; color: #fff; }
  .btn-reset { background: #e5e7eb; color: #374151; }
  .btn:disabled { opacity: .45; cursor: default; }
  .slider-wrap { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; }
  input[type=range] { width: 170px; accent-color: #1a73e8; }
  #alphaVal { color: #1a73e8; font-size: 17px; min-width: 52px; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; font-size: 14px; }
  .stats b { font-size: 17px; }
  #result {
    display: none; border-radius: 12px; padding: 18px; margin-top: 12px;
    text-align: center;
  }
  #result.win { display: block; background: #ecfdf5; border: 2px solid #10b981; }
  #result.fail { display: block; background: #fef2f2; border: 2px solid #ef4444; }
  #result h2 { margin: 0 0 6px; font-size: 20px; }
  #result p { margin: 4px 0; font-size: 14px; }
  #copyBtn {
    margin-top: 10px; border: none; border-radius: 8px; padding: 10px 16px;
    background: #1a73e8; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .mission {
    background: #fffbeb; border: 2px dashed #f59e0b; border-radius: 12px;
    padding: 14px 16px; margin-top: 14px; font-size: 14px;
  }
  .mission b { color: #b45309; }
  .note { font-size: 12px; color: #9ca3af; margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>🌫️ 안개 계곡 탈출</h1>
  <p>경사하강법 게임 — 보폭(학습률)을 조절해 깃발 지점에 정확히 내려가세요!</p>
</header>
<main>
  <div class="card">
    <canvas id="game" width="940" height="500"></canvas>
    <div id="result"></div>
  </div>

  <div class="card">
    <div class="levels">
      <button class="lv-btn active" data-lv="0">1단계 · 매끈한 계곡</button>
      <button class="lv-btn" data-lv="1">2단계 · 안개 웅덩이 계곡</button>
    </div>
    <p class="lv-desc" id="lvDesc"></p>
    <div class="controls">
      <div class="slider-wrap">
        <span>🥾 보폭(학습률 α)</span>
        <input type="range" id="alpha" min="0.05" max="1.5" step="0.05" value="0.4">
        <span id="alphaVal">0.40</span>
      </div>
      <button class="btn btn-step" id="stepBtn">🥾 한 걸음</button>
      <button class="btn btn-auto" id="autoBtn">▶ 자동 진행</button>
      <button class="btn btn-reset" id="resetBtn">↺ 다시 시작</button>
    </div>
    <div class="stats">
      <span>에포크 <b id="stEpoch">0</b></span>
      <span>현재 손실 J <b id="stLoss">—</b></span>
      <span>깃발까지 거리 <b id="stDist">—</b></span>
    </div>
  </div>

  <div class="mission">
    <b>🏆 도전 과제</b><br>
    ① 가장 적은 에포크로 깃발에 도착해 보세요 &nbsp; ② 2단계 웅덩이에 갇히면? 보폭을 키워 점프!<br>
    성공하면 결과 화면을 캡처해서 드라이브에 올려주세요. (파일명: 학번_이름)
  </div>
  <p class="note">💡 이 게임 = 경사하강법 그 자체! 한 걸음마다 <b>w ← w − α·(기울기)</b> 로 이동합니다.</p>
</main>

<script>
// ── 레벨 정의 ──
// J: 손실함수(계곡 모양), dJ: 기울기, target: 깃발 위치(전역 최소점)
const LEVELS = [
  {
    name: '1단계 · 매끈한 계곡',
    desc: '울퉁불퉁한 곳이 없는 매끈한 계곡이에요. 어떤 보폭이 가장 빠른지 찾아보세요!',
    J: w => w * w,
    dJ: w => 2 * w,
    w0: () => 4.3 + Math.random() * 0.6,  // 시작 위치 (조금씩 랜덤)
    target: 0, eps: 0.12,
    bound: 10, maxEpoch: 80, wrange: [-6, 6]
  },
  {
    name: '2단계 · 안개 웅덩이 계곡',
    desc: '중간에 웅덩이(극소점)가 숨어 있어요! 보폭이 작으면 웅덩이에 갇혀요. 크게 점프해 보세요!',
    J: w => 0.3 * w * w + 2 * Math.sin(w),
    dJ: w => 0.6 * w + 2 * Math.cos(w),
    w0: () => 4.3 + Math.random() * 0.6,
    target: -1.202, eps: 0.15,
    bound: 10, maxEpoch: 80, wrange: [-6, 6]
  }
];

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

let lv = 0, w = 0, epoch = 0, trail = [], stuckCount = 0;
let playing = false, autoTimer = null, animating = false;
let charW = 0, charY = 0;  // 캐릭터 애니메이션용 표시 위치

const $ = id => document.getElementById(id);

function L() { return LEVELS[lv]; }

// ── 좌표 변환 ──
let yMin = 0, yMax = 1;
function rescale() {
  const { J, wrange } = L();
  yMin = Infinity; yMax = -Infinity;
  for (let x = wrange[0]; x <= wrange[1]; x += 0.05) {
    const y = J(x);
    if (y < yMin) yMin = y;
    if (y > yMax) yMax = y;
  }
  const pad = (yMax - yMin) * 0.25;
  yMin -= pad; yMax += pad;
}
const X = wv => 40 + (wv - L().wrange[0]) / (L().wrange[1] - L().wrange[0]) * (W - 80);
const Y = jv => H - 50 - (jv - yMin) / (yMax - yMin) * (H - 130);

// ── 그리기 ──
function draw() {
  const { J, target, eps, wrange } = L();
  ctx.clearRect(0, 0, W, H);

  // 계곡 채우기
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1e3a5f');
  grad.addColorStop(1, '#0b1220');
  ctx.beginPath();
  ctx.moveTo(X(wrange[0]), H);
  for (let x = wrange[0]; x <= wrange[1]; x += 0.05) ctx.lineTo(X(x), Y(J(x)));
  ctx.lineTo(X(wrange[1]), H);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // 계곡 선
  ctx.beginPath();
  for (let x = wrange[0]; x <= wrange[1]; x += 0.05) {
    const px = X(x), py = Y(J(x));
    x === wrange[0] ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.strokeStyle = '#7dd3fc';
  ctx.lineWidth = 3;
  ctx.stroke();

  // 목표 구간 (깃발 존) 하이라이트
  ctx.beginPath();
  for (let x = target - eps; x <= target + eps; x += 0.02) {
    const px = X(x), py = Y(J(x));
    x === target - eps ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = 8;
  ctx.stroke();

  // 안개
  const fog = ctx.createLinearGradient(0, 0, 0, H * 0.45);
  fog.addColorStop(0, 'rgba(226,232,240,0.55)');
  fog.addColorStop(1, 'rgba(226,232,240,0)');
  ctx.fillStyle = fog;
  ctx.fillRect(0, 0, W, H * 0.45);

  // 이동 궤적
  ctx.fillStyle = 'rgba(125,211,252,0.7)';
  for (const p of trail) {
    ctx.beginPath();
    ctx.arc(X(p.w), Y(J(p.w)), 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // 깃발
  const fy = Y(J(target));
  ctx.font = '34px serif';
  ctx.fillText('🚩', X(target) - 14, fy - 12);

  // 시작 지점
  ctx.font = '22px serif';
  ctx.fillText('🏁', X(trail.length ? trail[0].w : w) - 11, Y(J(trail.length ? trail[0].w : w)) - 30);

  // 캐릭터 (등산객)
  const bounce = animating ? Math.abs(Math.sin(Date.now() / 90)) * 8 : 0;
  ctx.font = '36px serif';
  ctx.fillText('🧗', charW - 18, charY - 14 - bounce);
}

function syncChar() {
  charW = X(w);
  charY = Y(L().J(w));
}

// ── 상태 표시 ──
function updateStats() {
  const { J, target } = L();
  $('stEpoch').textContent = epoch;
  $('stLoss').textContent = J(w).toFixed(3);
  $('stDist').textContent = Math.abs(w - target).toFixed(3);
}

// ── 결과 ──
function endGame(type) {
  stopAuto();
  $('stepBtn').disabled = true;
  $('autoBtn').disabled = true;
  const r = $('result');
  const alpha = parseFloat($('alpha').value).toFixed(2);
  if (type === 'win') {
    r.className = 'win';
    r.innerHTML = `<h2>🎉 성공!</h2>
      <p><b>${epoch}번</b> 만에 깃발에 도착했어요! (보폭 α = ${alpha})</p>
      <p>더 적은 에포크로도 가능할까요? 보폭을 바꿔 다시 도전해 보세요!</p>
      <button id="copyBtn">📋 결과 복사하기</button>`;
    $('copyBtn').onclick = () => {
      const t = `안개계곡 ${lv + 1}단계: ${epoch}번, 보폭 ${alpha}`;
      navigator.clipboard.writeText(t).then(() => {
        $('copyBtn').textContent = '✅ 복사됨! 드라이브에 붙여넣으세요';
      });
    };
  } else {
    r.className = 'fail';
    const msg = {
      diverge: '💥 발산! 보폭이 너무 커서 계곡 밖으로 날아갔어요. 보폭을 줄여보세요.',
      timeout: '⏱️ 시간 초과! 80번 안에 도착하지 못했어요. 보폭을 키워보세요.',
      trapped: '😵 웅덩이에 갇혔어요! (극소점) 작은 보폭으론 절대 못 나와요. ↺ 다시 시작해서 처음부터 큰 보폭으로 점프해 보세요!'
    }[type];
    r.innerHTML = `<h2>실패</h2><p>${msg}</p>`;
  }
}

// ── 한 걸음 (경사하강법!) ──
function step(done) {
  if (animating) { if (done) done(false); return; }
  const { dJ, target, eps, bound, maxEpoch } = L();
  const alpha = parseFloat($('alpha').value);
  const wOld = w;
  const wNew = wOld - alpha * dJ(wOld);  // ★ 경사하강법 업데이트!
  epoch++;

  if (Math.abs(wNew - wOld) < 1e-4) stuckCount++; else stuckCount = 0;

  // 애니메이션
  animating = true;
  const t0 = Date.now(), dur = 320;
  (function anim() {
    const t = Math.min(1, (Date.now() - t0) / dur);
    const we = wOld + (wNew - wOld) * t;
    charW = X(we); charY = Y(L().J(we));
    draw();
    if (t < 1) requestAnimationFrame(anim);
    else {
      animating = false;
      w = wNew;
      trail.push({ w });
      syncChar(); draw(); updateStats();
      // 종료 판정
      let end = null;
      if (Math.abs(w - target) <= eps) end = 'win';
      else if (Math.abs(w) > bound) end = 'diverge';
      else if (epoch >= maxEpoch) end = 'timeout';
      else if (stuckCount >= 5) end = 'trapped';
      if (end) endGame(end);
      if (done) done(!end);
    }
  })();
}

function stopAuto() {
  playing = false;
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  $('autoBtn').textContent = '▶ 자동 진행';
}
function startAuto() {
  playing = true;
  $('autoBtn').textContent = '⏸ 정지';
  autoTimer = setInterval(() => {
    step(cont => { if (!cont) stopAuto(); });
  }, 420);
}

// ── 리셋 / 레벨 ──
function reset() {
  stopAuto();
  w = L().w0();
  epoch = 0; trail = [{ w }]; stuckCount = 0;
  rescale(); syncChar(); draw(); updateStats();
  $('result').className = '';
  $('result').style.display = 'none';
  $('stepBtn').disabled = false;
  $('autoBtn').disabled = false;
}
function setLevel(i) {
  lv = i;
  document.querySelectorAll('.lv-btn').forEach(b =>
    b.classList.toggle('active', +b.dataset.lv === i));
  $('lvDesc').textContent = L().desc;
  reset();
}

$('stepBtn').onclick = () => step();
$('autoBtn').onclick = () => playing ? stopAuto() : startAuto();
$('resetBtn').onclick = reset;
$('alpha').oninput = e => { $('alphaVal').textContent = parseFloat(e.target.value).toFixed(2); };
document.querySelectorAll('.lv-btn').forEach(b =>
  b.onclick = () => setLevel(+b.dataset.lv));

setLevel(0);
</script>
</body>
</html>
